disable-rules:
  - private-key

rules:
  - id: real-private-key
    category: AsymmetricPrivateKey
    title: Asymmetric Private Key
    severity: HIGH
    keywords:
      - "BEGIN PRIVATE KEY"
      - "BEGIN RSA PRIVATE KEY"
      - "BEGIN EC PRIVATE KEY"
      - "BEGIN CERTIFICATE"
    regex: (?is)-----BEGIN[ A-Z]{0,20}(?:PRIVATE KEY|CERTIFICATE)-----\s*(?P<secret>[A-Za-z0-9+/=\r\n]{40,})\s*-----END[ A-Z]{0,20}(?:PRIVATE KEY|CERTIFICATE)-----
    secret-group-name: secret

allow-rules:
  - id: ignore-rds-certs
    description: Ignore known RDS and internal CA certificate files
    path: .*(ADCB-SUBCA\.crt|ADCB\.ROOTCA\.crt|Amazon-RDS-Root-ECC384-X509\.crt|Amazon-RDS-Root-RSA2048-X509\.crt|Amazon-RDS-Root-RSA4096-X509\.crt|DigiCert_EV_RSA_CA_G2\.crt)$