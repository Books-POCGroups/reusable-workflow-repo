name: 'CodeQL Microservice Scan'
description: 'Scan a microservice with CodeQL and upload SARIF results.'
inputs:
  service:
    description: 'Microservice directory name under Services/'
    required: false
    default: ''
  language:
    description: 'Language for CodeQL analysis'
    required: true
  token:
    description: 'GitHub token for authentication'
    required: true

outputs:
  has_vulnerabilities:
    description: "Whether High/Critical vulnerabilities were found"
    value: ${{ steps.vuln_check.outputs.has_vulnerabilities }}

  vuln_table:
    description: "Markdown table of vulnerabilities"
    value: ${{ steps.vuln_check.outputs.vuln_table }}

runs:
  using: 'composite'
  steps:
  
    # Initialize CodeQL for Java / Java-Kotlin
    - name: Initialize CodeQL (Java / Kotlin)
      if: inputs.language != 'actions'
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ inputs.language }}
        build-mode: manual
        source-root: ${{ inputs.service }}
        config-file: ${{ github.workspace }}/workflow-repo/.github/codeql/codeql-config.yml

    # Initialize CodeQL for GitHub Actions
    - name: Initialize CodeQL (GitHub Actions)
      if: inputs.language == 'actions'
      uses: github/codeql-action/init@v4
      with:
        languages: actions
        build-mode: none
        config-file: ${{ github.workspace }}/workflow-repo/.github/codeql/codeql-config.yml

    - name: Build service for CodeQL (Gradle)
      if: inputs.language != 'actions'
      shell: bash
      working-directory: ${{ inputs.service }}
      env:
        GH_USERNAME: ${{ github.actor }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        pwd
        ls -l
       
        chmod +x gradlew
        ./gradlew clean build -x test \
          --no-daemon \
          --warn \
          -Dorg.gradle.jvmargs=-Xmx2048M

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{inputs.language}}"
      
