
name: Upload Secrets to Secrets Manager
run-name: "Generating Secrets - env var for `${{ inputs.domain }}/${{ inputs.Application }}` - `${{ inputs.environment }}` - `${{ inputs.region }}`"

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Target Service Domain"
        required: true
        type: choice
        options:
          - books
      Application:
        description: 'Target application (e.g., ai-auth-service)'
        required: true
        type: choice
        options:
          - books-mgmt-service
      environment:
        description: 'Target environment (e.g., sit, uat, preprod, prod)'
        required: true
        type: choice
        options:
          - sit
          - uat
          - preprod
          - prod
      region:
        description: 'Target AWS region'
        required: true
        type: choice
        options:
          - us-east-1
      runner:
        description: "Codebuild runner for the pipeline"
        default: codebuild-myapp-sandbox-dcc1-runner
        type: string
        required: true

jobs:
  upload-secrets:
    runs-on: ${{ inputs.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
    environment: ${{ github.event.inputs.environment }}
    env:
      AWS_REGION: ${{ inputs.region }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install yq manually
        run: |
          set -euo pipefail
          echo "Installing yq version v4.25.1..."

          # Install wget if missing
          apt-get update
          apt-get install -y wget

          # Install yq to $HOME/bin
          mkdir -p "$HOME/bin"
          wget "https://github.com/mikefarah/yq/releases/download/v4.25.1/yq_linux_amd64" \
            -O "$HOME/bin/yq"

          chmod +x "$HOME/bin/yq"

          # Persist PATH for subsequent steps
          echo "$HOME/bin" >> "$GITHUB_PATH"

          # Verify installation
          "$HOME/bin/yq" --version

      - name: Read config.yml for environment
        id: read-config
        run: |
          set -euo pipefail
          CONFIG_PATH="secrets/${{ inputs.domain }}/${{ inputs.Application }}/${{ inputs.environment }}/config.yml"
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "Config file $CONFIG_PATH not found!" >&2
            exit 1
          fi
          echo "CONFIG_PATH=$CONFIG_PATH" >> $GITHUB_ENV
      - name: Assume AWS Role
        id: assume-role
        env:
          CONFIG_FILE: env/${{ inputs.domain }}/${{ inputs.Application }}/${{ inputs.environment }}/config.yaml
        run: |
          set -euo pipefail
          
          # Extract the ARN from the YAML file
          AWS_ROLE_ARN=$(yq e '.arn' "$CONFIG_FILE")
          echo "Assuming AWS role: $AWS_ROLE_ARN"

          CREDS=$(aws sts assume-role --role-arn "$AWS_ROLE_ARN" --role-session-name github-actions-session)
          echo "AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r '.Credentials.AccessKeyId')" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r '.Credentials.SecretAccessKey')" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$(echo $CREDS | jq -r '.Credentials.SessionToken')" >> $GITHUB_ENV
          aws sts get-caller-identity

      - name: Parse config.yml and upload secrets to AWS Secrets Manager (skip placeholders, case-insensitive)
        run: |
          set -euo pipefail
          echo "Uploading secrets from $CONFIG_PATH to AWS Secrets Manager..."

          APP_PREFIX="${{ inputs.Application }}"

           ########################################
          # LOAD TAGS
          ########################################
          TAG_FILE="tag/tag.json"

          if [ ! -f "$TAG_FILE" ]; then
            echo "Tag file $TAG_FILE not found!"
            exit 1
          fi

          echo "Loading tags from $TAG_FILE"

          # Convert tag.json into AWS CLI tag structure
          TAGS=$(jq -c '
            to_entries
            | map({
                Key: .key,
                Value: (.value | tostring)
              })
          ' "$TAG_FILE")

          echo "Tags loaded successfully"

           # Override Environment from workflow input
          TAGS=$(jq -c \
            --arg env "${{ inputs.environment }}" '
              .Environment = $env
              | to_entries
              | map({
                  Key: .key,
                  Value: (.value | tostring)
                })
          ' "$TAG_FILE")
          
          ########################################
          # KEY-VALUE SECRETS
          ########################################
          for secret_name in $(yq e '.secrets.key_value_secrets[].name' "$CONFIG_PATH"); do

            secret_id="${APP_PREFIX}_${secret_name}"

            secret_data=$(yq e -o=json ".secrets.key_value_secrets[] | select(.name == \"$secret_name\") | .data" "$CONFIG_PATH")

            if aws secretsmanager describe-secret --secret-id "$secret_id" --region "$AWS_REGION" >/dev/null 2>&1; then

              # 🚫 Case-insensitive check
              if echo "$secret_data" | grep -qi "changeit" || \
                echo "$secret_data" | grep -qi "paste your certificate content in aws console"; then

                echo "Skipping update for $secret_id (placeholder detected)"

              else
                echo "Updating existing secret: $secret_id"
                aws secretsmanager put-secret-value \
                  --secret-id "$secret_id" \
                  --secret-string "$secret_data" \
                  --region "$AWS_REGION"

                aws secretsmanager tag-resource \
                  --secret-id "$secret_id" \
                  --tags "$TAGS" \
                  --region "$AWS_REGION"
              fi

            else
              echo "Creating new secret: $secret_id"
              aws secretsmanager create-secret \
                --name "$secret_id" \
                --secret-string "$secret_data" \
                --tags "$TAGS" \
                --region "$AWS_REGION"
            fi
          done

          ########################################
          # PLAINTEXT SECRETS
          ########################################
          for secret_name in $(yq e '.secrets.plaintext_secrets[].name' "$CONFIG_PATH"); do

            secret_id="${APP_PREFIX}_${secret_name}"

            secret_value=$(yq e ".secrets.plaintext_secrets[] | select(.name == \"$secret_name\") | .value" "$CONFIG_PATH")

            if aws secretsmanager describe-secret --secret-id "$secret_id" --region "$AWS_REGION" >/dev/null 2>&1; then

              # Convert to lowercase for case-insensitive match
              lower_value=$(echo "$secret_value" | tr '[:upper:]' '[:lower:]')

              if [[ "$lower_value" == *"changeit"* ]] || \
                [[ "$lower_value" == *"paste your certificate content in aws console"* ]]; then

                echo "Skipping update for $secret_id (placeholder detected)"

              else
                echo "Updating existing secret: $secret_id"
                aws secretsmanager put-secret-value \
                  --secret-id "$secret_id" \
                  --secret-string "$secret_value" \
                  --tags "$TAGS" \
                  --region "$AWS_REGION"
              fi

            else
              echo "Creating new secret: $secret_id"
              aws secretsmanager create-secret \
                --name "$secret_id" \
                --secret-string "$secret_value" \
                --tags "$TAGS" \
                --region "$AWS_REGION"
            fi
          done

          echo "✅ All secrets processed successfully (case-insensitive placeholders ignored)."
