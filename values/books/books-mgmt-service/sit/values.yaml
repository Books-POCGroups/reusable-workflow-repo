
replicaCount: 1

image:
  repository: 349326896769.dkr.ecr.eu-west-1.amazonaws.com/books-ms-repo
  tag: tag
  pullPolicy: IfNotPresent

service:
  name: mib-ai-service
  type: ClusterIP
  port: 8080
  containerPort: 8080

configMap:
  name: ai-auth-app-config
  data:
    APP_CERT_STORE_PATH: /usr/lib/jvm/java-21-amazon-correttose/lib/security/cacerts
    spring.profiles.active: sit
    LIQUIBASE_CONTEXT: sit
    CONTAINER_PORT: 8080
    

secret:
  name: ai-auth-db-secret
  data:
    DB_NAME: TEST
    DB_PASSWORD: TEST

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "900m"
    memory: "3Gi"

truststore:
  javaHome: /usr/lib/jvm/java-21-amazon-corretto

ingress:
  enabled: true
  name: books-mgmt-ingress
  tls:
   secretName: books-mgmt-ingress-tls
   cert: |
     <<tls_cert>>
   key: |
     <<tls_key>>

host: "books-mgmt-service.test.local"

paths:
  - path: /books
    pathType: Prefix
    service:
      name: books-mgmt-service
      port: 8080
