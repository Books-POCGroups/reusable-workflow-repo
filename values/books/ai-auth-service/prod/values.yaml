
replicaCount: 4

image:
  repository: 229410149234.dkr.ecr.eu-west-1.amazonaws.com/mib2-microservice-repo
  tag: tag
  pullPolicy: IfNotPresent

service:
  name: mib-ai-service
  type: ClusterIP
  port: 8080
  containerPort: 8080

configMap:
  name: ai-auth-app-config
  data:
    APP_CERT_STORE_PATH: /usr/lib/jvm/java-21-amazon-correttose/lib/security/cacerts
    spring.profiles.active: prod
    KMS_ID: arn:aws:kms:eu-west-1:693426248978:key/f127ae19-e9f2-4da3-ad4a-3fe4573dac54
    CLIENT_ID: <<CLIENT_ID>>
    CLIENT_SECRET: <<CLIENT_SECRET>>
    AI_AUTH_TOKEN_URL: https://capp-aimib-be-prod-uan-fh14v9.greencoast-b24ff26d.uaenorth.azurecontainerapps.io/v1/auth/access-token
    prop.sensitive.keys: DB_USERNAME,DB_PASSWORD,CLIENT_ID,CLIENT_SECRET,ORACLE_DB_USERNAME,ORACLE_DB_PASSWORD
    LIQUIBASE_CONTEXT: prod
    CONTAINER_PORT: 8080
    SERVER_TOMCAT_THREADS_MAX: "250"
    SERVER_TOMCAT_ACCEPT_COUNT: "150"
    MIB_USE_VIRTUAL_THREADS: "true"
    MIB_ASYNC_CORE_POOL_SIZE: "10"
    MIB_ASYNC_MAX_POOL_SIZE: "20"
    MIB_ASYNC_QUEUE_CAPACITY: "100"
    DB_POOL_MAX: "200"
    DB_POOL_MIN: "25"
    DB_POOL_CONNECTION_TIMEOUT: "180000"
    DB_POOL_IDLE_TIMEOUT: "40000"
    DB_POOL_MAX_LIFETIME: "1800000"
    DB_POOL_VALIDATION_TIMEOUT: "5000"
    VALIDATION_QUERY: "SELECT 1"
    DB_POOL_LEAK_DETECTION_MS: "600000"
    DB_POOL_JMX: "true"
    AUDIT_ASYNC_CORE_POOL_SIZE: "100"
    AUDIT_ASYNC_MAX_POOL_SIZE: "400"
    AUDIT_ASYNC_QUEUE_CAPACITY: "50000"

secret:
  name: ai-auth-db-secret
  data:
    DB_NAME: <<DB_NAME>>
    DB_PASSWORD: <<DB_PASSWORD>>
    DB_PORT: <<DB_PORT>>
    DB_SCHEMA: <<DB_SCHEMA>>
    DB_URL: <<DB_URL>>
    DB_USERNAME: <<DB_USERNAME>>
    PROP_DEC_KEY: <<PROP_DEC_KEY>>
    ORACLE_DB_URL: <<ORACLE_DB_URL>>
    ORACLE_DB_USERNAME: <<ORACLE_DB_USERNAME>>
    ORACLE_DB_PASSWORD: <<ORACLE_DB_PASSWORD>>

resources:
  requests:
    cpu: "1000m"
    memory: "4Gi"
  limits:
    cpu: "2000m"
    memory: "6Gi"

truststore:
  javaHome: /usr/lib/jvm/java-21-amazon-corretto

ingress:
  enabled: true
  name: ai-auth-ingress
  tls:
    secretName: ai-auth-ingress-tls
    cert: |
      <<tls_cert>>
    key: |
      <<tls_key>>

host: "mib-ai-service-prod.adcbmis.local"

paths:
  - path: /ai-services
    pathType: Prefix
    service:
      name: ai-auth-service
      port: 8080
