      value: |
        -----BEGIN CERTIFICATE-----
        Paste your certificate content in aws console
        -----END CERTIFICATE-----
    - name: "tls_key"
      value: |
        -----BEGIN PRIVATE KEY-----
        Paste your certificate content in aws console
        -----END PRIVATE KEY-----