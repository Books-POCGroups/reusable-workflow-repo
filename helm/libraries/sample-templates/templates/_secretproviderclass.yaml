{{- define "microservice.secretProviderClass" -}}
{{- if.Values.secretStore.enabled -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "microservice.fullname". }}-aws-secrets
  namespace: {{.Release.Namespace }}
  labels:
    {{- include "microservice.labels". | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "/app/{{.Chart.Name }}/{{.Values.environment }}/secrets"
        objectType: "secretsmanager"
        {{- if.Values.secretStore.jmesPath }}
        jmesPath: 
          {{- toYaml.Values.secretStore.jmesPath | nindent 10 }}
        {{- end }}
{{- end -}}
{{- end -}}